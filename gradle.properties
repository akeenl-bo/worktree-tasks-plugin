group = dev.akeen.worktreetasks
version = 0.1.36

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Configuration cache is disabled: the New Task flow opens projects / touches global
# application state at runtime, and keeping it off avoids surprising cache invalidations
# during iterative plugin development.
org.gradle.configuration-cache = false

org.gradle.caching = true
